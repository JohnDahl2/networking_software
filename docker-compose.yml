services:
  sniffer:
    build: ./go-sniffer
    container_name: packet_sniffer_go
    restart: "no" 
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # This replaces the entire environment block
    env_file:
      - .env
    volumes:
      - ./go-sniffer/data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale_db
    restart: unless-stopped
    network_mode: "host" # Critical because sniffer is on host mode
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: packets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packets"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_wal_size=4GB
      -c min_wal_size=1GB
      -c checkpoint_timeout=15min

  ui:
    build: ./python-ui
    container_name: packet_ui_python
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: