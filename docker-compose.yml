services:
  sniffer:
    build: ./go-sniffer
    container_name: packet_sniffer_go
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./go-sniffer/data:/app/data
      - ./go-sniffer/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: timescale_db
    restart: unless-stopped
    # 4. Removed network_mode: "host" -> Now isolated inside the Docker bridge network
    ports:
      - "5432:5432" # Maps Timescale to localhost:5432 for external tool access (Postico, DBeaver, etc.)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: packets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packets"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    command: [
      "postgres",
      "-c", "synchronous_commit=off",
      "-c", "shared_buffers=1GB",
      "-c", "wal_writer_delay=200ms",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "max_wal_size=4GB"
    ]

  ui:
    build: ./python-ui
    container_name: packet_ui_python
    restart: unless-stopped
    ports:
      - "8501:8501" # Maps your UI natively to your Mac's localhost:8501
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: